[project]
name = "jobscout"
version = "0.1.0"
description = "Local job collector and deterministic profile matcher"
readme = "README.md"
authors = [
    { name = "Dustin Hendriks", email = "d.d.hendrix97@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "pydantic>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[project.scripts]
jobscout = "jobscout.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
